services:
  ceremony-server:
    image: ${CEREMONY_IMAGE:-ceremony-server:latest}
    ports:
      - "8888:8888"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /credentials.json
      SERVER_GCP_PROJECT_ID: ${SERVER_GCP_PROJECT_ID:?Set your GCP project}
      SERVER_BUCKET_ID: ${SERVER_BUCKET_ID:?Set your GCS bucket}
      SERVER_ADMIN_VERIFYING_KEY: ${SERVER_ADMIN_VERIFYING_KEY:?Set your administrator public key}
      SERVER_DB_PATH: "sqlite:/data/ceremony.sqlite3?mode=rwc"
      RUST_BACKTRACE: 1
    restart: always
    volumes:
      - "${GOOGLE_APPLICATION_CREDENTIALS:?Set your credentials file path}:/credentials.json:ro"
      - ceremony_data:/data
      - "./server/logs:/logs"

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${CEREMONY_HOST:-localhost} --to ceremony-server:8888
    volumes:
      - caddy_data:/data


volumes:
  caddy_data:
  ceremony_data:
